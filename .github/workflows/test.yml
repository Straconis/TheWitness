name: Test The Witness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build and audio tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config ffmpeg
      - run: npm ci
      - name: Cache checksum-pinned audio sources
        uses: actions/cache@v4
        with:
          path: work/portable/sources
          key: audio-sources-${{ runner.os }}-${{ hashFiles('licenses/audio/sources.json') }}
      - name: Build and test
        run: |
          python3 scripts/prepare-audio-sources.py
          sh scripts/build-portable-audio.sh
          npm test
