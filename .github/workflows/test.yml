name: Test The Witness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build and audio tools
        run: sudo apt-get update && sudo apt-get install -y build-essential ffmpeg
      - run: npm ci
      - name: Build and test
        run: |
          mkdir -p bin
          ln -s /usr/bin/ffmpeg bin/ffmpeg
          npm test
